<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vestend LLC — Software, E-Learning &amp; Ebooks</title>
  <meta name="description" content="Discover Vestend LLC's innovative software, e-learning courses, and ebooks to elevate your skills and knowledge.">
  <meta name="keywords" content="software publishing, e-learning solutions, ebook publishing, digital learning resources, online education tools, Vestend LLC">
  <link rel="canonical" href="https://vestend.com">
  <link rel="icon" href="data:,">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vestend.com">
  <meta property="og:title" content="Vestend LLC — Software, E-Learning &amp; Ebooks">
  <meta property="og:description" content="Discover Vestend LLC's innovative software, e-learning courses, and ebooks to elevate your skills and knowledge.">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://vestend.com/images/vintage-mid-century-travel-poster-1.jpg">

  <!-- Location: Utah and Nevada -->
  <meta name="geo.placename" content="Utah and Nevada, United States">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Vestend LLC",
    "url": "https://vestend.com",
    "email": "info@vestend.com",
    "description": "Vestend LLC publishes software, e-learning courses, and ebooks.",
    "areaServed": [
      { "@type": "State", "name": "Utah" },
      { "@type": "State", "name": "Nevada" }
    ],
    "location": [
      { "@type": "Place", "address": { "@type": "PostalAddress", "addressRegion": "UT", "addressCountry": "US" } },
      { "@type": "Place", "address": { "@type": "PostalAddress", "addressRegion": "NV", "addressCountry": "US" } }
    ]
  }
  </script>

  <!-- Fonts (self-hosted) -->
  <link rel="preload" href="/fonts/fraunces-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">

  <style>
    :root {
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.78);
      --accent: #f2b35b;
      --overlay: rgba(12, 16, 24, 0.55);
      --card: rgba(12, 16, 24, 0.45);
      --border: rgba(255, 255, 255, 0.18);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #1b2230;
      -webkit-font-smoothing: antialiased;
    }

    /* Skip link: hidden until focused */
    .skip-link {
      position: absolute;
      left: 1rem;
      top: -3rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #1b2230;
      border-radius: 6px;
      font-weight: 500;
      text-decoration: none;
      z-index: 10;
    }
    .skip-link:focus { top: 1rem; }

    /* Full-screen hero with background image */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        linear-gradient(var(--overlay), var(--overlay)),
        url("/images/vintage-mid-century-travel-poster-1.jpg") center / cover no-repeat,
        linear-gradient(135deg, #2b3a55, #1b2230);
    }

    .card {
      width: 100%;
      max-width: 40rem;
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1.25rem, 5vw, 3rem);
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 8vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .tagline {
      margin: 1rem 0 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.15rem, 3.5vw, 1.5rem);
      line-height: 1.4;
      color: var(--text-muted);
    }

    .tagline .highlight { color: var(--accent); }

    .divider {
      width: 4rem;
      height: 2px;
      margin: 2rem auto;
      border: 0;
      background: var(--accent);
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .contact a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.2s, color 0.2s;
    }
    .contact a:hover,
    .contact a:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="hero">
    <div class="card">
      <h1>Vestend LLC</h1>
      <p class="tagline">
        We publish <span class="highlight">software</span>,
        <span class="highlight">e-learning</span>, and
        <span class="highlight">ebooks</span>.
      </p>

      <hr class="divider">

      <ul class="contact">
        <li><a href="mailto:info@vestend.com">info@vestend.com</a></li>
        <li>Utah &amp; Nevada</li>
        <li><a href="/privacy">Privacy Policy</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
